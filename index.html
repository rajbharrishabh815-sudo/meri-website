<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>50 Game Arcade</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;text-align:center}
h1{padding:15px;background:linear-gradient(90deg,#ff00ff,#00ffff);margin:0;font-size:20px}
.game-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:15px;max-width:700px;margin:auto}
.game-box{background:#1a1a1a;border:2px solid #00ffff;border-radius:12px;padding:20px 5px;cursor:pointer;font-size:12px}
.game-box:hover{transform:scale(1.08);border-color:#ff00ff}
iframe{width:100%;height:100vh;border:none;display:none}
#backBtn{position:fixed;top:10px;left:10px;z-index:100;background:#ff00ff;border:none;color:#fff;padding:8px 15px;border-radius:8px;display:none;cursor:pointer}
</style>
</head>
<body>
<h1>🎮 50 Game Arcade 🎮</h1>
<button id="backBtn" onclick="backToMenu()">◀ Back</button>

<div id="menu" class="game-grid">
<div class="game-box" onclick="loadGame('snake')">🐍<br>Snake</div>
<div class="game-box" onclick="loadGame('flappy')">🐦<br>Flappy</div>
<div class="game-box" onclick="loadGame('tictac')">❌⭕<br>TicTac</div>
<div class="game-box" onclick="loadGame('rps')">✊<br>RPS</div>
<div class="game-box" onclick="loadGame('dino')">🦖<br>Dino</div>
<div class="game-box" onclick="loadGame('traffic3d')">🚗<br>Traffic 3D</div>
<div class="game-box" onclick="loadGame('click')">👆<br>Click Speed</div>
<div class="game-box" onclick="loadGame('guess')">🔢<br>Guess Number</div>
<div class="game-box" onclick="loadGame('color')">🎨<br>Color Match</div>
<div class="game-box" onclick="loadGame('pong')">🏓<br>Pong</div>
</div>

<iframe id="gameFrame"></iframe>

<script>
const games = {
snake: `<!DOCTYPE html><html><body style="margin:0;background:#000;display:flex;flex-direction:column;align-items:center;color:#0f0"><h3>Score: <span id="sc">0</span></h3><canvas id="c" width="300" height="300" style="border:2px solid #0f0"></canvas><div><button onclick="d='up'">↑</button></div><div><button onclick="d='left'">←</button><button onclick="d='right'">→</button></div><div><button onclick="d='down'">↓</button></div><script>let c=document.getElementById('c').getContext('2d'),x=150,y=150,s=20,d='right',t=[{x:150,y:150}],f={x:100,y:100},sc=0;function g(){x+=d=='right'?s:d=='left'?-s:0;y+=d=='down'?s:d=='up'?-s:0;if(x<0||x>300||y<0||y>300||t.some(p=>p.x==x&&p.y==y)){alert('Over! '+sc);location.reload()}t.unshift({x,y});if(x==f.x&&y==f.y){sc++;document.getElementById('sc').innerText=sc;f={x:Math.floor(Math.random()*15)*s,y:Math.floor(Math.random()*15)*s}}else t.pop();c.clearRect(0,0,300,300);c.fillStyle='red';c.fillRect(f.x,f.y,s);c.fillStyle='#0f0';t.forEach(p=>c.fillRect(p.x,p.y,s))}setInterval(g,150)<\/script></body></html>`,
flappy: `<!DOCTYPE html><html><body onclick="v=-8" style="margin:0;overflow:hidden;background:#70c5ce"><div id="b" style="width:40px;height:40px;background:yellow;border-radius:50%;position:absolute;left:100px;top:200px"></div><div id="score" style="position:fixed;top:20px;left:50%;transform:translateX(-50%);font-size:40px;color:#fff">0</div><script>let b=document.getElementById('b'),y=200,v=0,sc=0,pipes=[];function pipe(){let h=Math.random()*200+50,p1=document.createElement('div'),p2=document.createElement('div');p1.style.cssText=p2.style.cssText='position:absolute;width:60px;background:green';p1.style.height=h+'px';p1.style.top='0px';p1.style.left='400px';p2.style.height=(400-h-120)+'px';p2.style.top=(h+120)+'px';p2.style.left='400px';document.body.appendChild(p1);document.body.appendChild(p2);pipes.push([p1,p2]);setTimeout(pipe,1500)}pipe();setInterval(()=>{v+=0.4;y+=v;b.style.top=y+'px';pipes.forEach(([p1,p2])=>{let x=parseInt(p1.style.left)-3;p1.style.left=p2.style.left=x+'px';if(x<-60){p1.remove();p2.remove();pipes.shift();sc++;document.getElementById('score').innerText=sc}let br=b.getBoundingClientRect(),p1r=p1.getBoundingClientRect(),p2r=p2.getBoundingClientRect();if(br.left<p1r.right&&br.right>p1r.left&&(br.top<p1r.bottom||br.bottom>p2r.top)){alert('Over! '+sc);location.reload()}});if(y>500||y<0){alert('Over! '+sc);location.reload()}},20)<\/script></body></html>`,
tictac: `<!DOCTYPE html><html><body style="margin:0;background:#1a1a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;color:#fff"><h2>Tic Tac Toe</h2><div style="display:grid;grid-template-columns:repeat(3,100px);gap:5px" id="board"></div><div id="msg" style="margin-top:20px">तू X है</div><script>let board=['','',''],gameOver=false;function draw(){let b=document.getElementById('board');b.innerHTML='';board.forEach((v,i)=>{let c=document.createElement('div');c.style.cssText='width:100px;height:100px;background:#333;border:2px solid #00ffff;display:flex;align-items:center;justify-content:center;font-size:50px;cursor:pointer';c.innerText=v;c.onclick=()=>move(i);b.appendChild(c)})}function move(i){if(board[i]!=''||gameOver)return;board[i]='X';if(check('X')){document.getElementById('msg').innerText='तू जीता!';gameOver=true;draw();return}if(!board.includes('')){document.getElementById('msg').innerText='Draw!';gameOver=true;draw();return}setTimeout(()=>{let m=board.findIndex(v=>v=='');if(m!=-1)board[m]='O';if(check('O')){document.getElementById('msg').innerText='Computer जीता!';gameOver=true}draw()},300)}function check(p){let w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];return w.some(([a,b,c])=>board[a]==p&&board[b]==p&&board[c]==p)}draw()<\/script></body></html>`,
rps: `<!DOCTYPE html><html><body style="margin:0;background:#1a1a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;color:#fff;text-align:center"><h2>Rock Paper Scissors</h2><div><button onclick="play('✊')" style="width:80px;height:80px;font-size:40px;margin:10px;border-radius:50%;border:3px solid #00ffff;background:#333">✊</button><button onclick="play('✋')" style="width:80px;height:80px;font-size:40px;margin:10px;border-radius:50%;border:3px solid #00ffff;background:#333">✋</button><button onclick="play('✌️')" style="width:80px;height:80px;font-size:40px;margin:10px;border-radius:50%;border:3px solid #00ffff;background:#333">✌️</button></div><div id="res" style="margin-top:20px;font-size:20px">चुनो!</div><script>function play(u){let c=['✊','✋','✌️'][Math.floor(Math.random()*3)],r='';if(u==c)r='Draw!';else if((u=='✊'&&c=='✌️')||(u=='✋'&&c=='✊')||(u=='✌️'&&c=='✋'))r='तू जीता!';else r='Computer जीता!';document.getElementById('res').innerText='तू: '+u+' vs '+c+'\n'+r}<\/script></body></html>`,
dino: `<!DOCTYPE html><html><body onclick="jump()" style="margin:0;overflow:hidden;background:#f7f7f7"><div style="width:100%;height:200px;position:relative;border-bottom:2px solid #333;margin-top:100px"><div id="dino" style="width:40px;height:40px;background:#333;position:absolute;bottom:0;left:50px"></div><div id="cactus" style="width:20px;height:40px;background:green;position:absolute;bottom:0;right:-20px"></div></div><div id="score" style="position:fixed;top:20px;right:20px;font-size:24px">Score: 0</div><script>let dino=document.getElementById('dino'),cactus=document.getElementById('cactus'),isJumping=false,score=0;function jump(){if(isJumping)return;isJumping=true;let up=setInterval(()=>{let b=parseInt(dino.style.bottom||'0');if(b>=100){clearInterval(up);let down=setInterval(()=>{b-=5;dino.style.bottom=b+'px';if(b<=0){clearInterval(down);isJumping=false;dino.style.bottom='0px'}})}b+=5;dino.style.bottom=b+'px'},20)}setInterval(()=>{let cRight=parseInt(cactus.style.right||'-20');cRight+=6;cactus.style.right=cRight+'px';if(cRight>window.innerWidth){cactus.style.right='-20px';score++;document.getElementById('score').innerText='Score: '+score}let dRect=dino.getBoundingClientRect(),cRect=cactus.getBoundingClientRect();if(dRect.right>cRect.left&&dRect.left<cRect.right&&dRect.bottom>cRect.top){alert('Over! '+score);location.reload()}},20)<\/script></body></html>`,
traffic3d: `<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><style>body{margin:0;overflow:hidden}#hud{position:fixed;top:15px;width:100%;display:flex;justify-content:space-between;padding:0 20px;color:#00ffff;font-weight:bold}#controls{position:fixed;bottom:30px;width:100%;display:flex;justify-content:space-between;padding:0 40px}button{width:80px;height:80px;font-size:35px;border-radius:20px;border:3px solid #00ffff;background:rgba(0,0,0,0.5);color:#00ffff}</style></head><body><div id="hud"><div>DISTANCE<br><span id="dist">0 m</span></div><div>SPEED<br><span id="spd" style="color:#0f0">0 kmh</span></div></div><div id="controls"><button ontouchstart="move(-1)">◀</button><button ontouchstart="move(1)">▶</button></div><script>let scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000),renderer=new THREE.WebGLRenderer();renderer.setSize(window.innerWidth,window.innerHeight);document.body.appendChild(renderer.domElement);scene.background=new THREE.Color(0x87CEEB);let light=new THREE.DirectionalLight(0xffffff,1);light.position.set(0,50,50);scene.add(light);let road=new THREE.PlaneGeometry(12,200);let roadMesh=new THREE.Mesh(road,new THREE.MeshLambertMaterial({color:0x2c3e50}));roadMesh.rotation.x=-Math.PI/2;roadMesh.position.z=-100;scene.add(roadMesh);function makeCar(color,z){let g=new THREE.Group();let body=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.6,3.5),new THREE.MeshLambertMaterial({color:color}));body.position.y=0.3;g.add(body);g.position.z=z;return g}let player=makeCar(0x2ecc71,8);scene.add(player);let lane=1,lanePos=[-3.5,0,3.5],targetX=0;let cars=[],colors=[0xe74c3c,0xf1c40f,0x3498db];for(let i=0;i<8;i++){let c=makeCar(colors[i%3],-20-i*20);c.position.x=lanePos[i%3];scene.add(c);cars.push(c)}camera.position.set(0,5,12);camera.lookAt(0,0,5);let distance=0,speed=30;function move(dir){lane+=dir;if(lane<0)lane=0;if(lane>2)lane=2;targetX=lanePos}function animate(){requestAnimationFrame(animate);player.position.x+=(targetX-player.position.x)*0.1;roadMesh.position.z+=speed/10;if(roadMesh.position.z>100)roadMesh.position.z=-100;cars.forEach(obj=>{obj.position.z+=speed/10;if(obj.position.z>15){obj.position.z=-180;obj.position.x=lanePos[Math.floor(Math.random()*3)]}let dx=Math.abs(obj.position.x-player.position.x);let dz=Math.abs(obj.position.z-player.position.z);if(dx<1.8&&dz<3.5){alert('Crash! '+distance+'m');location.reload()}});distance+=speed/30;if(speed<220)speed+=0.05;document.getElementById('dist').innerText=Math.floor(distance)+' m';document.getElementById('spd').innerText=Math.floor(speed)+' kmh';renderer.render(scene,camera)}animate();window.move=move<\/script></body></html>`,
click: `<!DOCTYPE html><html><body style="margin:0;background:#1a1a1a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Arial"><h2>Click Speed Test</h2><h1 id="t">10</h1><button id="btn" onclick="c()" style="width:200px;height:200px;font-size:50px;border-radius:50%;background:#ff00ff;border:none;color:#fff">CLICK</button><h3>Clicks: <span id="clk">0</span></h3><script>let clicks=0,time=10,playing=false,timer;function c(){if(!playing){playing=true;timer=setInterval(()=>{time--;document.getElementById('t').innerText=time;if(time==0){clearInterval(timer);alert('Total Clicks: '+clicks);location.reload()}},1000)}clicks++;document.getElementById('clk').innerText=clicks}<\/script></body></html>`,
guess: `<!DOCTYPE html><html><body style="margin:0;background:#1a1a1a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Arial;text-align:center"><h2>1 से 100 तक Guess करो</h2><input id="num" type="number" style="padding:10px;font-size:20px;width:100px;text-align:center"><button onclick="g()" style="padding:10px 20px;font-size:18px;margin-top:10px;background:#00ffff;border:none">Guess</button><h3 id="msg">चल शुरू हो जा</h3><script>let n=Math.floor(Math.random()*100)+1,t=0;function g(){t++;let u=parseInt(document.getElementById('num').value);if(u==n)alert('सही! '+t+' Try में जीता');else document.getElementById('msg').innerText=u<n?'बड़ा लो':'छोटा लो'}<\/script></body></html>`,
color: `<!DOCTYPE html><html><body style="margin:0;background:#1a1a1a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Arial"><h2 id="word" style="font-size:40px"></h2><div id="opts"></div><h3>Score: <span id="sc">0</span></h3><script>let colors=['Red','Blue','Green','Yellow','Pink'],score=0;function newQ(){let word=colors[Math.floor(Math.random()*5)],color=colors[Math.floor(Math.random()*5)];document.getElementById('word').innerText=word;document.getElementById('word').style.color=color.toLowerCase();let opts=document.getElementById('opts');opts.innerHTML='';colors.forEach(c=>{let b=document.createElement('button');b.innerText=c;b.style.cssText='padding:15px;margin:5px;font-size:18px;background:#333;color:#fff;border:2px solid #00ffff';b.onclick=()=>{if(c.toLowerCase()==color.toLowerCase()){score++;document.getElementById('sc').innerText=score}newQ()};opts.appendChild(b)})}newQ()<\/script></body></html>`,
pong: `<!DOCTYPE html><html><body style="margin:0;background:#000;overflow:hidden" onmousemove="p.y=event.clientY-50"><canvas id="c" width="800" height="400"></canvas><script>let c=document.getElementById('c').getContext('2d'),p={x:10,y:150,w:10,h:100},c2={x:780,y:150,w:10,h:100},b={x:400,y:200,sx:5,sy:5,r:10};function g(){c.clearRect(0,0,800,400);c.fillStyle='#fff';c.fillRect(p.x,p.y,p.w,p.h);c.fillRect(c2.x,c2.y,c2.w,c2.h);c.beginPath();c.arc(b.x,b.y,b.r,0,Math.PI*2);c.fill();b.x+=b.sx;b.y+=b.sy;if(b.y<10||b.y>390)b.sy*=-1;if(b.x<20&&b.y>p.y&&b.y<p.y+100)b.sx*=-1;if(b.x>780&&b.y>c2.y&&b.y<c2.y+100)b.sx*=-1;c2.y=b.y-50;if(b.x<0||b.x>800){b.x=400;b.y=200}}setInterval(g,20)<\/script></body></html>`
};
function loadGame(name){
document.getElementById('menu').style.display='none';
document.getElementById('backBtn').style.display='block';
document.getElementById('gameFrame').style.display='block';
document.getElementById('gameFrame').srcdoc=games[name];
}
function backToMenu(){
document.getElementById('menu').style.display='grid';
document.getElementById('backBtn').style.display='none';
document.getElementById('gameFrame').style.display='none';
}
</script>
</body>
</html>
