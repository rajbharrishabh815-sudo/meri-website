<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>50 Game Zone</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;text-align:center}
h1{padding:15px;background:linear-gradient(90deg,#ff00ff,#00ffff);margin:0;font-size:20px}
.game-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:15px;max-width:700px;margin:auto}
.game-box{background:#1a1a1a;border:2px solid #00ffff;border-radius:12px;padding:20px 5px;cursor:pointer;font-size:12px;transition:0.2s}
.game-box:hover{transform:scale(1.08);border-color:#ff00ff}
iframe{width:100%;height:100vh;border:none;display:none}
#backBtn{position:fixed;top:10px;left:10px;z-index:100;background:#ff00ff;border:none;color:#fff;padding:8px 15px;border-radius:8px;display:none;cursor:pointer}
</style>
</head>
<body>
<h1>🎮 50 Game Arcade 🎮</h1>
<button id="backBtn" onclick="backToMenu()">◀ Back</button>

<div id="menu" class="game-grid">
<div class="game-box" onclick="loadGame('snake')">🐍<br>Snake</div>
<div class="game-box" onclick="loadGame('flappy')">🐦<br>Flappy</div>
<div class="game-box" onclick="loadGame('tictac')">❌⭕<br>TicTac</div>
<div class="game-box" onclick="loadGame('rps')">✊<br>RPS</div>
<div class="game-box" onclick="loadGame('dino')">🦖<br>Dino</div>
<div class="game-box" onclick="loadGame('traffic3d')">🚗<br>Traffic 3D</div>
<div class="game-box" onclick="loadGame('click')">👆<br>Click Speed</div>
<div class="game-box" onclick="loadGame('guess')">🔢<br>Guess Number</div>
<div class="game-box" onclick="loadGame('color')">🎨<br>Color Match</div>
<div class="game-box" onclick="loadGame('2048')">2️⃣<br>2048</div>
</div>

<iframe id="gameFrame"></iframe>

<script>
const games = {
// 1. Snake - पहले वाला ही
snake: `<!DOCTYPE html><html><body style="margin:0;background:#000;display:flex;flex-direction:column;align-items:center;color:#0f0"><h3>Score: <span id="sc">0</span></h3><canvas id="c" width="300" height="300" style="border:2px solid #0f0"></canvas><div><button onclick="d='up'">↑</button></div><div><button onclick="d='left'">←</button><button onclick="d='right'">→</button></div><div><button onclick="d='down'">↓</button></div><script>let c=document.getElementById('c').getContext('2d'),x=150,y=150,s=20,d='right',t=[{x:150,y:150}],f={x:100,y:100},sc=0;function g(){x+=d=='right'?s:d=='left'?-s:0;y+=d=='down'?s:d=='up'?-s:0;if(x<0||x>300||y<0||y>300||t.some(p=>p.x==x&&p.y==y)){alert('Over! '+sc);location.reload()}t.unshift({x,y});if(x==f.x&&y==f.y){sc++;document.getElementById('sc').innerText=sc;f={x:Math.floor(Math.random()*15)*s,y:Math.floor(Math.random()*15)*s}}else t.pop();c.clearRect(0,0,300,300);c.fillStyle='red';c.fillRect(f.x,f.y,s);c.fillStyle='#0f0';t.forEach(p=>c.fillRect(p.x,p.y,s))}setInterval(g,150)<\/script></body></html>`,

// 2. Flappy Bird - पहले वाला
flappy: `<!DOCTYPE html><html><body onclick="v=-8" style="margin:0;overflow:hidden;background:#70c5ce"><div id="b" style="width:40px;height:40px;background:yellow;border-radius:50%;position:absolute;left:100px;top:200px"></div><div id="score" style="position:fixed;top:20px;left:50%;transform:translateX(-50%);font-size:40px;color:#fff">0</div><script>let b=document.getElementById('b'),y=200,v=0,sc=0,pipes=[];function pipe(){let h=Math.random()*200+50,p1=document.createElement('div'),p2=document.createElement('div');p1.style.cssText=p2.style.cssText='position:absolute;width:60px;background:green';p1.style.height=h+'px';p1.style.top='0px';p1.style.left='400px';p2.style.height=(400-h-120)+'px';p2.style.top=(h+120)+'px';p2.style.left='400px';document.body.appendChild(p1);document.body.appendChild(p2);pipes.push([p1,p2]);setTimeout(pipe,1500)}pipe();setInterval(()=>{v+=0.4;y+=v;b.style.top=y+'px';pipes.forEach(([p1,p2])=>{let x=parseInt(p1.style.left)-3;p1.style.left=p2.style.left=x+'px';if(x<-60){p1.remove();p2.remove();pipes.shift();sc++;document.getElementById('score').innerText=sc}let br=b.getBoundingClientRect(),p1r=p1.getBoundingClientRect(),p2r=p2.getBoundingClientRect();if(br.left<p1r.right&&br.right>p1r.left&&(br.top<p1r.bottom||br.bottom>p2r.top)){alert('Over! '+sc);location.reload()}});if(y>500||y<0){alert('Over! '+sc);location.reload()}},20)<\/script></body></html>`,

// 3. Click Speed Test - नया छोटा Game
click: `<!DOCTYPE html><html><body style="margin:0;background:#1a1a1a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Arial"><h2>Click Speed Test</h2><h1 id="t">10</h1><button id="btn" onclick="c()" style="width:200px;height:200px;font-size:50px;border-radius:50%;background:#ff00ff;border:none;color:#fff">CLICK</button><h3>Clicks: <span id="clk">0</span></h3><script>let clicks=0,time=10,playing=false,timer;function c(){if(!playing){playing=true;timer=setInterval(()=>{time--;document.getElementById('t').innerText=time;if(time==0){clearInterval(timer);alert('Total Clicks: '+clicks);location.reload()}},1000)}clicks++;document.getElementById('clk').innerText=clicks}<\/script></body></html>`,

// 4. Guess Number - नया
guess: `<!DOCTYPE html><html><body style="margin:0;background:#1a1a1a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Arial;text-align:center"><h2>1 से 100 तक Guess करो</h2><input id="num" type="number" style="padding:10px;font-size:20px;width:100px;text-align:center"><button onclick="g()" style="padding:10px 20px;font-size:18px;margin-top:10px;background:#00ffff;border:none">Guess</button><h3 id="msg">चल शुरू हो जा</h3><script>let n=Math.floor(Math.random()*100)+1,t=0;function g(){t++;let u=parseInt(document.getElementById('num').value);if(u==n)alert('सही! '+t+' Try में जीता');else document.getElementById('msg').innerText=u<n?'बड़ा लो':'छोटा लो'}<\/script></body></html>`,

// 5. Color Match - नया
color: `<!DOCTYPE html><html><body style="margin:0;background:#1a1a1a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Arial"><h2 id="word" style="font-size:40px"></h2><div id="opts"></div><h3>Score: <span id="sc">0</span></h3><script>let colors=['Red','Blue','Green','Yellow','Pink'],score=0;function newQ(){let word=colors[Math.floor(Math.random()*5)],color=colors[Math.floor(Math.random()*5)];document.getElementById('word').innerText=word;document.getElementById('word').style.color=color.toLowerCase();let opts=document.getElementById('opts');opts.innerHTML='';colors.forEach(c=>{let b=document.createElement('button');b.innerText=c;b.style.cssText='padding:15px;margin:5px;font-size:18px;background:#333;color:#fff;border:2px solid #00ffff';b.onclick=()=>{if(c.toLowerCase()==color.toLowerCase()){score++;document.getElementById('sc').innerText=score}newQ()};opts.appendChild(b)})}newQ()<\/script></body></html>`,

// 6 से 10: बाकी पुराने Game - tictac, rps, dino, traffic3d, 2048
tictac: `<!DOCTYPE html><html><body style="margin:0;background:#1a1a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;color:#fff"><h2>Tic Tac Toe</h2><div style="display:grid;grid-template-columns:repeat(3,100px);gap:5px" id="board"></div><div id="msg" style="margin-top:20px">तू X है</div><script>let board=['','',''],
