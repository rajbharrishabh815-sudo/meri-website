<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rishabh Game Zone</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;text-align:center}
h1{padding:20px;background:linear-gradient(90deg,#ff00ff,#00ffff);margin:0;font-size:22px}
.game-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;padding:20px;max-width:600px;margin:auto}
.game-box{background:#1a1a1a;border:2px solid #00ffff;border-radius:15px;padding:30px 10px;cursor:pointer;transition:0.3s}
.game-box:hover{transform:scale(1.05);border-color:#ff00ff;box-shadow:0 0 20px #00ffff}
.game-box h2{margin:10px 0 5px;font-size:16px}
.game-box p{margin:0;font-size:12px;color:#aaa}
iframe{width:100%;height:100vh;border:none;display:none}
#backBtn{position:fixed;top:10px;left:10px;z-index:100;background:#ff00ff;border:none;color:#fff;padding:10px 20px;border-radius:8px;display:none;cursor:pointer;font-weight:bold}
</style>
</head>
<body>
<h1>🎮 Rishabh Game Zone 🎮</h1>
<button id="backBtn" onclick="backToMenu()">◀ Back</button>

<div id="menu" class="game-grid">
<div class="game-box" onclick="loadGame('snake')"><h2>🐍 Snake</h2><p>Apple खाओ</p></div>
<div class="game-box" onclick="loadGame('flappy')"><h2>🐦 Flappy Bird</h2><p>Tap करके उड़ो</p></div>
<div class="game-box" onclick="loadGame('tictac')"><h2>❌⭕ Tic Tac Toe</h2><p>X vs O</p></div>
<div class="game-box" onclick="loadGame('rps')"><h2>✊ Rock Paper</h2><p>Computer हराओ</p></div>
<div class="game-box" onclick="loadGame('dino')"><h2>🦖 Dino Run</h2><p>Tap करके कूदो</p></div>
<div class="game-box" onclick="loadGame('traffic3d')"><h2>🚗 Traffic Racer 3D</h2><p>Highway भगाओ</p></div>
</div>

<iframe id="gameFrame"></iframe>

<script>
const games = {
snake: `<!DOCTYPE html><html><body style="margin:0;background:#000;display:flex;flex-direction:column;align-items:center;color:#0f0;font-family:Arial"><h2>Snake Score: <span id="sc">0</span></h2><canvas id="c" width="300" height="300" style="border:2px solid #0f0"></canvas><div style="margin-top:10px"><button onclick="d='up'" style="padding:15px 25px;font-size:20px">↑</button></div><div><button onclick="d='left'" style="padding:15px 25px;font-size:20px">←</button><button onclick="d='right'" style="padding:15px 25px;font-size:20px">→</button></div><div><button onclick="d='down'" style="padding:15px 25px;font-size:20px">↓</button></div><script>let c=document.getElementById('c').getContext('2d'),x=150,y=150,s=20,d='right',t=[{x:150,y:150}],f={x:100,y:100},sc=0;function g(){x+=d=='right'?s:d=='left'?-s:0;y+=d=='down'?s:d=='up'?-s:0;if(x<0||x>300||y<0||y>300||t.some(p=>p.x==x&&p.y==y)){alert('Game Over! Score:'+sc);location.reload()}t.unshift({x,y});if(x==f.x&&y==f.y){sc++;document.getElementById('sc').innerText=sc;f={x:Math.floor(Math.random()*15)*s,y:Math.floor(Math.random()*15)*s}}else t.pop();c.clearRect(0,0,300,300);c.fillStyle='red';c.fillRect(f.x,f.y,s);c.fillStyle='#0f0';t.forEach(p=>c.fillRect(p.x,p.y,s))}setInterval(g,150)<\/script></body></html>`,
flappy: `<!DOCTYPE html><html><body onclick="v=-8" style="margin:0;overflow:hidden;background:#70c5ce;font-family:Arial"><div id="b" style="width:40px;height:40px;background:yellow;border-radius:50%;position:absolute;left:100px;top:200px"></div><div id="score" style="position:fixed;top:20px;left:50%;transform:translateX(-50%);font-size:40px;color:#fff">0</div><script>let b=document.getElementById('b'),y=200,v=0,sc=0,pipes=[];function pipe(){let h=Math.random()*200+50,p1=document.createElement('div'),p2=document.createElement('div');p1.style.cssText=p2.style.cssText='position:absolute;width:60px;background:green';p1.style.height=h+'px';p1.style.top='0px';p1.style.left='400px';p2.style.height=(400-h-120)+'px';p2.style.top=(h+120)+'px';p2.style.left='400px';document.body.appendChild(p1);document.body.appendChild(p2);pipes.push([p1,p2]);setTimeout(pipe,1500)}pipe();setInterval(()=>{v+=0.4;y+=v;b.style.top=y+'px';pipes.forEach(([p1,p2])=>{let x=parseInt(p1.style.left)-3;p1.style.left=p2.style.left=x+'px';if(x<-60){p1.remove();p2.remove();pipes.shift();sc++;document.getElementById('score').innerText=sc}let br=b.getBoundingClientRect(),p1r=p1.getBoundingClientRect(),p2r=p2.getBoundingClientRect();if(br.left<p1r.right&&br.right>p1r.left&&(br.top<p1r.bottom||br.bottom>p2r.top)){alert('Game Over! Score:'+sc);location.reload()}});if(y>500||y<0){alert('Game Over! Score:'+sc);location.reload()}},20)<\/script></body></html>`,
tictac: `<!DOCTYPE html><html><body style="margin:0;background:#1a1a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;color:#fff;font-family:Arial"><h2>Tic Tac Toe</h2><div style="display:grid;grid-template-columns:repeat(3,100px);gap:5px" id="board"></div><div id="msg" style="margin-top:20px;font-size:18px">तू X है</div><script>let board=['','',''],gameOver=false;function draw(){let b=document.getElementById('board');b.innerHTML='';board.forEach((v,i)=>{let c=document.createElement('div');c.style.cssText='width:100px;height:100px;background:#333;border:2px solid #00ffff;display:flex;align-items:center;justify-content:center;font-size:50px;cursor:pointer;font-weight:bold';c.innerText=v;c.onclick=()=>move(i);b.appendChild(c)})}function move(i){if(board[i]!=''||gameOver)return;board[i]='X';if(check('X')){document.getElementById('msg').innerText='तू जीत गया! 🔥';gameOver=true;draw();return}if(!board.includes('')){document.getElementById('msg').innerText='Draw!';gameOver=true;draw();return}setTimeout(()=>{let m=board.findIndex(v=>v=='');if(m!=-1)board[m]='O';if(check('O')){document.getElementById('msg').innerText='Computer जीत गया!';gameOver=true}draw()},300)}function check(p){let w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];return w.some(([a,b,c])=>board[a]==p&&board[b]==p&&board[c]==p)}draw()<\/script></body></html>`,
rps: `<!DOCTYPE html><html><body style="margin:0;background:#1a1a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;color:#fff;text-align:center;font-family:Arial"><h2>Rock Paper Scissors</h2><div><button onclick="play('✊')" style="width:80px;height:80px;font-size:40px;margin:10px;border-radius:50%;border:3px solid #00ffff;background:#333;cursor:pointer">✊</button><button onclick="play('✋')" style="width:80px;height:80px;font-size:40px;margin:10px;border-radius:50%;border:3px solid #00ffff;background:#333;cursor:pointer">✋</button><button onclick="play('✌️')" style="width:80px;height:80px;font-size:40px;margin:10px;border-radius:50%;border:3px solid #00ffff;background:#333;cursor:pointer">✌️</button></div><div id="res" style="margin-top:20px;font-size:20px">चुनो!</div><script>function play(u){let c=['✊','✋','✌️'][Math.floor(Math.random()*3)],r='';if(u==c)r='Draw! बराबर';else if((u=='✊'&&c=='✌️')||(u=='✋'&&c=='✊')||(u=='✌️'&&c=='✋'))r='तू जीत गया! 🔥';else r='Computer जीत गया!';document.getElementById('res').innerText='तू: '+u+' vs '+c+'\n'+r}<\/script></body></html>`,
dino: `<!DOCTYPE html><html><body onclick="jump()" style="margin:0;overflow:hidden;background:#f7f7f7;font-family:Arial"><div style="width:100%;height:200px;position:relative;border-bottom:2px solid #333;margin-top:100px"><div id="dino" style="width:40px;height:40px;background:#333;position:absolute;bottom:0;left:50px"></div><div id="cactus" style="width:20px;height:40px;background:green;position:absolute;bottom:0;right:-20px"></div></div><div id="score" style="position:fixed;top:20px;right:20px;font-size:24px">Score: 0</div><script>let dino=document.getElementById('dino'),cactus=document.getElementById('cactus'),isJumping=false,score=0;function jump(){if(isJumping)return;isJumping=true;let up=setInterval(()=>{let b=parseInt(dino.style.bottom||'0');if(b>=100){clearInterval(up);let down=setInterval(()=>{b-=5;dino.style.bottom=b+'px';if(b<=0){clearInterval(down);isJumping=false;dino.style.bottom='0px'}})}b+=5;dino.style.bottom=b+'px'},20)}setInterval(()=>{let cRight=parseInt(cactus.style.right||'-20');cRight+=6;cactus.style.right=cRight+'px';if(cRight>window.innerWidth){cactus.style.right='-20px';score++;document.getElementById('score').innerText='Score: '+score}let dRect=dino.getBoundingClientRect(),cRect=cactus.getBoundingClientRect();if(dRect.right>cRect.left&&dRect.left<cRect.right&&dRect.bottom>cRect.top){alert('Game Over! Score: '+score);location.reload()}},20)<\/script></body></html>`,
traffic3d: `<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><style>body{margin:0;overflow:hidden;background:#000;font-family:Arial}#hud{position:fixed;top:15px;width:100%;display:flex;justify-content:space-between;padding:0 20px;box-sizing:border-box;color:#00ffff;font-weight:bold;font-size:16px;text-shadow:0 0 10px #00ffff;z-index:100}#controls{position:fixed;bottom:30px;width:100%;display:flex;justify-content:space-between;padding:0 40px;box-sizing:border-box;z-index:100}button{width:80px;height:80px;font-size:35px;border-radius:20px;border:3px solid #00ffff;background:rgba(0,0,0,0.5);color:#00ffff;box-shadow:0 0 20px #00ffff}</style></head><body><div id="hud"><div>DISTANCE<br><span id="dist" style="font-size:24px">0 m</span></div><div>SCORE<br><span id="score" style="font-size:24px">0</span></div><div>SPEED<br><span id="spd" style="font-size:24px;color:#0f0">0 kmh</span></div></div><div id="controls"><button ontouchstart="move(-1)">◀</button><button ontouchstart="move(1)">▶</button></div><script>let scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);document.body.appendChild(renderer.domElement);scene.background=new THREE.Color(0x87CEEB);scene.fog=new THREE.Fog(0x87CEEB,50,200);let light=new THREE.DirectionalLight(0xffffff,1);light.position.set(0,50,50);scene.add(light);scene.add(new THREE.AmbientLight(0x404040));let road=new THREE.PlaneGeometry(12,200);let roadMat=new THREE.MeshLambertMaterial({color:0x2c3e50});let roadMesh=new THREE.Mesh(road,roadMat);roadMesh.rotation.x=-Math.PI/2;roadMesh.position.z=-100;scene.add(roadMesh);for(let i=-60;i<60;i+=6){let line=new THREE.PlaneGeometry(0.3,3);let lineMat=new THREE.MeshLambertMaterial({color:0xffffff});let lineMesh=new THREE.Mesh(line,lineMat);lineMesh.rotation.x=-Math.PI/2;lineMesh.position.set(0,0.01,i);scene.add(lineMesh)}function makeCar(color,z){let g=new THREE.Group();let body=new THREE.BoxGeometry(1.8,0.6,3.5);let bodyMat=new THREE.MeshLambertMaterial({color:color});let bodyMesh=new THREE.Mesh(body,bodyMat);bodyMesh.position.y=0.3;g.add(bodyMesh);let roof=new THREE.BoxGeometry(1.6,0.4,2);let roofMat=new THREE.MeshLambertMaterial({color:color});let roofMesh=new THREE.Mesh(roof,roofMat);roofMesh.position.y=0.8;roofMesh.position.z=-0.2;g.add(roofMesh);g.position.z=z;g.position.y=0;return g}let player=makeCar(0x2ecc71,8);scene.add(player);let lane=1,lanePos=[-3.5,0,3.5],targetX=0;let cars=[],colors=[0xe74c3c,0xf1c40f,0x3498db,0x9b59b6,0xe67e22];for(let i=0;i<10;i++){let c=makeCar(colors[Math.floor(Math.random()*5)],-20-i*20);c.position.x=lanePos[Math.floor(Math.random()*3)];scene.add(c);cars.push(c)}camera.position.set(0,5,12);camera.lookAt(0,0,5);let distance=0,speed=30,score=0;function move(dir){lane+=dir;if(lane<0)lane=0;if(lane>2)lane=2;targetX=lanePos}function animate(){requestAnimationFrame(animate);player.position.x+=(targetX-player.position.x)*0.1;roadMesh.position.z+=speed/10;if(roadMesh.position.z>100)roadMesh.position.z=-100;scene.children.forEach(obj=>{if(obj.isGroup&&obj!=player){obj.position.z+=speed/10;if(obj.position.z>15){obj.position.z=-180-Math.random()*50;obj.position.x=lanePos[Math.floor(Math.random()*3)];obj.children[0].material.color.setHex(colors[Math.floor(Math.random()*5)])}let dx=Math.abs(obj.position.x-player.position.x);let dz=Math.abs(obj.position.z-player.position.z);if(dx<1.8&&dz<3.5){alert('CRASH! Distance: '+distance+'m Score: '+score);location.reload()}}});distance+=speed/30;if(speed<220)speed+=0.05;score=Math.floor(distance/10);document.getElementById('dist').innerText=Math.floor(distance)+' m';document.getElementById('spd').innerText=Math.floor(speed)+' kmh';document.getElementById('score').innerText=score;renderer.render(scene,camera)}animate();window.move=move<\/script></body></html>`
};
function loadGame(name){
document.getElementById('menu').style.display='none';
document.getElementById('backBtn').style.display='block';
document.getElementById('gameFrame').style.display='block';
document.getElementById('gameFrame').srcdoc=games[name];
}
function backToMenu(){
document.getElementById('menu').style.display='grid';
document.getElementById('backBtn').style.display='none';
document.getElementById('gameFrame').style.display='none';
}
</script>
</body>
</html>
