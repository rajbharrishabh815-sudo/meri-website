<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rishabh Game Zone</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;text-align:center}
h1{padding:20px;background:linear-gradient(90deg,#ff00ff,#00ffff);margin:0;font-size:22px}
.game-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;padding:20px;max-width:600px;margin:auto}
.game-box{background:#1a1a1a;border:2px solid #00ffff;border-radius:15px;padding:30px 10px;cursor:pointer;transition:0.3s}
.game-box:hover{transform:scale(1.05);border-color:#ff00ff;box-shadow:0 0 20px #00ffff}
.game-box h2{margin:10px 0 5px;font-size:16px}
.game-box p{margin:0;font-size:12px;color:#aaa}
iframe{width:100%;height:100vh;border:none;display:none}
#backBtn{position:fixed;top:10px;left:10px;z-index:100;background:#ff00ff;border:none;color:#fff;padding:10px 20px;border-radius:8px;display:none;cursor:pointer
